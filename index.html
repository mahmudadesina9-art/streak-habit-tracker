<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <div class="status">
      <header class="status-bar">
        <span class="time">9:41</span>
        <span class="status-icons">
          <svg
            width="17"
            height="12"
            viewBox="0 0 17 12"
            fill="none"
            aria-hidden="true"
          >
            <path
              d="M1 8.5h2v3H1v-3zm4.5-3h2v6h-2v-6zM10 2h2v9.5h-2V2zM14.5 0h2v11.5h-2V0z"
              fill="#111"
            />
          </svg>
          <svg
            width="16"
            height="12"
            viewBox="0 0 16 12"
            fill="none"
            aria-hidden="true"
          >
            <path
              d="M8 3.2A7.2 7.2 0 0 1 13.4 5.4L14.6 4A8.8 8.8 0 0 0 8 1.6 8.8 8.8 0 0 0 1.4 4l1.2 1.4A7.2 7.2 0 0 1 8 3.2zm0 3.2a4 4 0 0 1 3 1.3l1.2-1.3A5.6 5.6 0 0 0 8 4.8 5.6 5.6 0 0 0 3.8 6.4L5 7.7A4 4 0 0 1 8 6.4zm0 5.6a1.6 1.6 0 1 0 0-3.2 1.6 1.6 0 0 0 0 3.2z"
              fill="#111"
            />
          </svg>
          <svg
            width="25"
            height="12"
            viewBox="0 0 25 12"
            fill="none"
            aria-hidden="true"
          >
            <rect x=".5" y=".5" width="21" height="11" rx="2.5" stroke="#111" />
            <rect x="2" y="2" width="16" height="8" rx="1.2" fill="#111" />
            <path d="M23 4v4a2 2 0 0 0 0-4z" fill="#111" />
          </svg>
        </span>
      </header>

      <div class="whloe-body">
        <h1 class="streak">STREAK</h1>
        <p class="small-steps">Small Steps. Big Changes.</p>
      </div>
      <section habit-card-section>
        <div class="habit-card" id="habitCard">
          <p class="today">TODAYS'S HABIT</p>
          <h1 class="code">Code every day</h1>
          <div class="streak-circle" id="streak-circle">
            <span id="streakCounts">0</span>
            <p>Day Streak</p>
          </div>
          <div class="italic-container"><i class="every">Every great projects start with consistency</i></div>
          <button class="completeBtn" id="complete-btn">Complete Today</button>
          <div class="week" id="days-container"></div>
      </section>

      <section class="activity">
        <div class="recent" id="recent-activity"></div>
      </section>

     <div class="actions-row">
         <button class="share-streak" id="share-btn" onclick="shareStreak()">Share Streak</button>
      <button class="reset" id="reset-btn" onclick="resetStreak()">Reset</button>
     </div>
    </div>
    <footer class="footer">
      <p>Consistency Builds Freedom</p>
    </footer>
  </body>

  <script>
    const STREAK_KEY = "habit_streak_count";
    const DATE_KEY = "habit_last_completed_date";
    const HISTORY_KEY = "habit_history_list";

    const streakCount = document.getElementById("streakCounts");
    const completeBtn = document.getElementById("complete-btn");
    const weeklyDaysContainer = document.getElementById("days-container")
    const activityContentArea = document.getElementById("recent-activity")
    const shareBtn = document.getElementById("share-btn")
    const resetBtn = document.getElementById("reset-btn")

    // alert("are you streaking today");
    function getToodayString() {
      const offset = new Date().getTimezoneOffset() * 60000;
      return new Date(Date.now() - offset).toISOString().split("T")[0];
    }

    function getYesterdayString() {
      const offset = new Date().getTimezoneOffset() * 60000;
      const yesterday = new Date(Date.now() - offset);
      yesterday.setDate(yesterday.getDate() - 1);
      return yesterday.toISOString().split("T")[0];
    }

    function renderWeeklyCalendar() {
        weeklyDaysContainer.innerHTML = "";

        const todayStr = getToodayString();
        const currentNavDate = new Date();
        const currentDayIndex = currentNavDate.getDay();

        const daysToMonday = currentDayIndex === 0 ? -6 : 1 - currentDayIndex;

        const mondayDate = new Date(currentNavDate);
        mondayDate.setDate(currentNavDate.getDate() + daysToMonday);

        const dayLabels = ["MON", "TUE", "WED", "THU", "FRI", "SAT", "SUN"];
        const completedHistory = JSON.parse(localStorage.getItem(HISTORY_KEY)) || [];

        for (let i = 0; i < 7; i++) {
            const loopDate = new Date(mondayDate);
            loopDate.setDate(mondayDate.getDate() + i);

            const offset = new Date().getTimezoneOffset() * 60000;
            const loopDateStr = new Date(loopDate.getTime() - offset).toISOString().split('T')[0];

            const isDayToday = (loopDateStr === todayStr);
            const isDayCompleted = completedHistory.includes(loopDateStr);

            const dayColumn = document.createElement("div");
            dayColumn.className = `day-coloumn ${isDayToday ? 'is-today' : ''}`;

            dayColumn.innerHTML = `<span class="day-label">${dayLabels[i]}</span>
            <div class="day-circle${isDayCompleted ? 'completed' : ''}"> ${isDayCompleted ? '\u2713' : ''}
                </div>
                <span class="today-marker">${isDayToday ? 'Today' : ''}</span> 
                `;

                weeklyDaysContainer.appendChild(dayColumn);
        }
    }

    function habitTracker() {
      const todayStr = getToodayString();
      const yesterdayStr = getYesterdayString();

      let currentStreak = parseInt(localStorage.getItem(STREAK_KEY)) || 0;
      const lastCompletedDate = localStorage.getItem(DATE_KEY);

      if (
        lastCompletedDate !== todayStr &&
        lastCompletedDate !== yesterdayStr
      ) {
        currentStreak = 0;
        localStorage.setItem(STREAK_KEY, 0);
      }

      streakCount.textContent = currentStreak;

      if (lastCompletedDate === todayStr) {
        setButtonCompleted();
      } else {
        setButtonActive();
      }
      renderRecentActivity();
    }

    function setButtonCompleted() {
      completeBtn.textContent = "Completed \u2713";
      completeBtn.disabled = true;
    }
    function setButtonActive() {
      completeBtn.textContent = "Completed \u2713";
      completeBtn.disabled = false;
    }

    completeBtn.addEventListener("click", () => {
      const todayStr = getToodayString();
      const yesterdayStr = getYesterdayString();

      let currentStreak = parseInt(localStorage.getItem(STREAK_KEY));
      const lastCompletedDate = localStorage.getItem(DATE_KEY);
      let completedHistory = JSON.parse(localStorage.getItem(HISTORY_KEY)) || [];

      if (lastCompletedDate === todayStr) {
        console.log("Data Protection: Already completed today doing nothing");
        return;
      }

      if (!lastCompletedDate) {
        currentStreak = 1;
      } else if (lastCompletedDate === yesterdayStr) {
        currentStreak += 1;
      } else {
        currentStreak = 1;
      }

      if (!completedHistory.includes(todayStr)){
        completedHistory.push(todayStr);
      }

      localStorage.setItem(STREAK_KEY, currentStreak);
      localStorage.setItem(DATE_KEY, todayStr);
      localStorage.setItem(HISTORY_KEY, JSON.stringify(completedHistory));

      streakCount.textContent = currentStreak;
      setButtonCompleted();

      renderRecentActivity();
    });
    habitTracker();

    function renderRecentActivity() {
        const completedHistory = JSON.parse(localStorage.getItem(HISTORY_KEY)) || [];
        
        if (completedHistory.length === 0) {
            activityContentArea.innerHTML = `<div class="empty-activity-state">
                
                <h4 class="empty-title">No Activity yet</h4>
                <p class="empty-text">Complete your habit to see your streak and activity here. </p>
                </div>
                `;
                return;
        }

        activityContentArea.innerHTML = `<div class="weekly-row" id="days-container"></div>`;
        const weeklyDaysContainer = document.getElementById("days-container")

        const todayStr = getToodayString();
        const currentNavDate = new Date();
        const currentDayIndex = currentNavDate.getDay();


        const daysToMonday = currentDayIndex === 0 ? -6 : 1 - currentDayIndex;
        const mondayDate = new Date(currentNavDate);
        mondayDate.setDate(currentNavDate.getDate() + daysToMonday);

         const dayLabels = ["MON", "TUE", "WED", "THU", "FRI", "SAT", "SUN"];

          for (let i = 0; i < 7; i++) {
            const loopDate = new Date(mondayDate);
            loopDate.setDate(mondayDate.getDate() + i);

            const offset = new Date().getTimezoneOffset() * 60000;
            const loopDateStr = new Date(loopDate.getTime() - offset).toISOString().split('T')[0];

            const isDayToday = (loopDateStr === todayStr);
            const isDayCompleted = completedHistory.includes(loopDateStr);

            const dayColumn = document.createElement("div");
            dayColumn.className = `day-coloumn ${isDayToday ? 'is-today' : ''}`;

            dayColumn.innerHTML = `<span class="day-label">${dayLabels[i]}</span>
            <div class="day-circle${isDayCompleted ? 'completed' : ''}"> ${isDayCompleted ? '\u2713' : ''}
                </div>
                <span class="today-marker">${isDayToday ? 'Today' : ''}</span> 
                `;

                weeklyDaysContainer.appendChild(dayColumn);
            }
    }

    function resetStreak() {
        if(confirm("Are you sure you want to clear your streak and your history?")){
            localStorage.removeItem(STREAK_KEY);
            localStorage.removeItem(DATE_KEY);
            localStorage.removeItem(HISTORY_KEY);

            habitTracker();
        }
    }

    function shareStreak() {
        const currentStreak = localStorage.getItem(STREAK_KEY) || 0;
        const shareText = ` \u{1F525} I am on a ${currentStreak}-day streak building consistency! Can you beat me?`

        if (navigator.share) {
            navigator.share({
                title: 'My Habit Streak Tracker',
                text: shareText
            }).catch(err => console.log("Error sharing:", err));
        } else {
            navigator.clipboard.writeText(shareText);
            alert("Streak detals compied to clipboard! paste it anywhere to share.")
        }
    }
  </script>
</html>
